name: Run Cypress Tests

on: 
  push:
    branches: [main]


jobs:
  cypress-run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: setup-node
        uses: actions/setup-node@v2
        with:
          node-version: '20'
      - uses: pnpm/action-setup@v2
        with:
          version: 7

      - name: Install dependencies
        run: npm install

      - name: Run Cypress tests
        run: npx cypress run

